<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Full Stack Quiz Application</h1>
    <p>Test Your Technical Skills</p>
    </header>
    <main>
        <section id="topic-section">
            <h2>Choose Your Topic</h2>
            <select id="topic-select">
                <option value="java">Java</option>
                <option value="sql">SQL</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="react">React</option>
                <option value="jdbc">JDBC</option>
                <option value="springboot">SpringBoot</option>
                <option value="apis">REST APIs</option>
                <option value="fullstack">Full Stack</option>
            </select>
            <button id="start-btn">Start Quiz</button>
        </section>
        <section id="quiz-section">
            <div id="quiz-info">
                <p id="question-count">Question 1 of 10</p>
                <p>Time Left: <span id="timer">30</span>s</p>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <h2 id="question">Your Question Will Appear Here</h2>
            <div id="options-container">
                <button class="option-btn">Option 1</button>
                <button class="option-btn">Option 2</button>
                <button class="option-btn">Option 3</button>
                <button class="option-btn">Option 4</button>
            </div>
            <p id="feedback"></p>
            <button id="next-btn">Next Question</button>
        </section>
        <section id="result-section">
            <h2>Quiz Completed!</h2>
            <p id="final-score">Your Score: 0/10</p>
            <p id="percentage">Percentage: 0%</p>
            <button id="restart-btn">Restart Quiz</button>

        </section>
    </main>
    <footer>
        <p>Keep Learning. Keep Growing.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
